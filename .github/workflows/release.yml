name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build VSIX
        run: yarn run build

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-vscode-${{ github.ref_name }}
          path: legado-vscode-*.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" legado-vscode-*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" legado-vscode-*.vsix --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
